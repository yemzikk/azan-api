<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f9f5">
  <title>AzanTimes · Prayer times widget</title>
  <style>
    :root{color-scheme:light;--bg:#f8f9f5;--ink:#244334;--muted:#73816d;--line:#e0e7d8;--green:#245b47}
    *{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:12px;background:var(--bg);color:var(--ink);font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
    a{color:inherit;text-underline-offset:3px}button{font:inherit;cursor:pointer}a:focus-visible,button:focus-visible{outline:3px solid #93ad76;outline-offset:4px}button:disabled{cursor:wait;opacity:.6}[hidden]{display:none!important}
    .widget{width:100%;max-width:480px;border:1px solid var(--line);border-radius:13px;background:#fff;overflow:hidden}.widget-header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px 0}.brand{display:inline-flex;align-items:center;gap:7px;text-decoration:none;font-size:12px;font-weight:700}.brand-mark{display:inline-flex;align-items:center;justify-content:center;width:23px;height:23px;border-radius:7px 7px 7px 2px;background:var(--green);color:white;font-size:19px;font-weight:500;line-height:1;padding-bottom:3px}.timezone{color:var(--muted);font-size:9px}.location{padding:12px 18px 13px}.location h1{font-size:15px;line-height:1.35;letter-spacing:-.2px;margin:0;overflow-wrap:anywhere}.location p{font-size:10px;color:var(--muted);margin:5px 0 0}
    .prayer{margin:0 10px 10px;padding:14px 15px;background:#214e3b;border-radius:8px;color:#fff}.prayer-top{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:8px;letter-spacing:.9px;color:#c7d5bb}.prayer-top>span:first-child{display:inline-flex;align-items:center;gap:6px}.dot{width:5px;height:5px;display:inline-block;border-radius:50%;background:#c6d899}.countdown{font-size:10px;letter-spacing:0;font-variant-numeric:tabular-nums;white-space:nowrap}.prayer-main{display:flex;align-items:baseline;justify-content:space-between;gap:14px;margin-top:9px}.prayer-name{font:400 31px/1.2 Georgia,serif;letter-spacing:-.4px}.prayer-time{font-size:16px;font-weight:500;white-space:nowrap}.prayer-date{font-size:9px;color:#b9cbb6;margin:9px 0 0}
    .message{margin:0 18px 16px;font-size:11px;line-height:1.7;color:var(--muted)}.error{border-top:1px solid var(--line);padding:14px 18px;color:#8d4937;font-size:11px}.error p{margin:0 0 10px}.retry{border:1px solid #cfdbbf;background:#f0f4ea;color:var(--green);font-size:11px;border-radius:5px;padding:6px 12px}.widget-footer{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:0 18px 13px;font-size:9px;color:var(--muted)}.widget-footer a{text-decoration:none;color:var(--green)}.widget-footer a:hover{text-decoration:underline}.empty-title{font-size:21px}.sr-only{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
    @media(max-width:300px){body{padding:6px}.widget-header{padding:11px 12px 0}.location{padding:11px 12px}.location h1{font-size:13px}.prayer{padding:12px}.prayer-name{font-size:26px}.prayer-time{font-size:14px}.prayer-top{font-size:7px}.countdown{font-size:9px}.widget-footer{padding:0 12px 11px}.message{margin-left:12px;margin-right:12px}}
    @media(max-height:210px){body{padding:4px;align-items:start}.widget-header{padding-top:8px}.location{padding-top:7px;padding-bottom:8px}.location p,.widget-footer{display:none}.prayer{padding:10px 13px;margin-bottom:6px}.prayer-main{margin-top:5px}.prayer-name{font-size:26px}.prayer-date{margin-top:4px}.message{margin-bottom:9px}.error{padding-top:9px;padding-bottom:9px}}
  </style>
</head>
<body>
  <main class="widget" id="widget" aria-busy="true">
    <div class="widget-header"><a class="brand" href="https://azantimes.in/" target="_blank" rel="noopener noreferrer"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 80 80" width="19" height="19" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"><path d="M20 65V39c0-15 15-16 20-24 5 8 20 9 20 24v26M15 65h50"/><path d="M43 31a12 12 0 1 0 9 20 12 12 0 0 1-9-20Z"/></svg></span> AzanTimes</a><span class="timezone">Indian Standard Time</span></div>
    <header class="location"><h1 id="location-name">Your local prayer times</h1><p id="today-date">Loading timetable…</p></header>
    <section class="prayer" id="next-prayer" aria-label="Next prayer" hidden>
      <div class="prayer-top"><span><span class="dot" aria-hidden="true"></span><span id="prayer-label">NEXT PRAYER</span></span><span class="countdown" id="countdown" role="timer" aria-label="Time until next prayer">—</span></div>
      <div class="prayer-main"><strong class="prayer-name" id="prayer-name">—</strong><span class="prayer-time" id="prayer-time">—</span></div>
      <p class="prayer-date" id="prayer-date"></p>
    </section>
    <p class="message" id="message">Finding your community’s timetable.</p>
    <div class="error" id="error" role="alert" hidden><p id="error-message"></p><button type="button" class="retry" id="retry">Try again</button></div>
    <footer class="widget-footer"><span>Prayer start times · IST</span><a id="dashboard-link" href="https://azantimes.in/" target="_blank" rel="noopener noreferrer">View timetable ↗</a></footer>
    <div id="announcement" class="sr-only" role="status"></div>
    <noscript><p class="message">Enable JavaScript to see live prayer times, or <a href="https://azantimes.in/" target="_blank" rel="noopener noreferrer">open AzanTimes</a>.</p></noscript>
  </main>
  <script type="module">
    const $ = (id) => document.getElementById(id);
    const locationId = new URLSearchParams(location.search).get('q');
    let helpers;
    let schedule = null;
    let controller;
    let version = 0;
    let lastDate = null;
    let lastPrayer = null;
    let loading = false;

    function tick() {
      if (!helpers) return;
      const now = new Date();
      const today = helpers.getDateKey(now);
      $('today-date').textContent = helpers.formatDate(today, { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
      if (lastDate && today !== lastDate && !loading) {
        lastDate = today;
        void load();
        return;
      }
      lastDate = today;
      if (!schedule || loading) return;
      const next = helpers.getNextPrayer(schedule, now);
      $('next-prayer').hidden = !next;
      if (!next) {
        $('message').hidden = false;
        $('message').textContent = `No upcoming prayer time is published for today or tomorrow. This source covers ${schedule.years.join(', ')}. Open the timetable to browse published dates.`;
        return;
      }
      $('prayer-label').textContent = next.isTomorrow ? 'NEXT PRAYER · TOMORROW' : 'NEXT PRAYER';
      $('prayer-name').textContent = next.label;
      $('prayer-time').textContent = helpers.formatTime(next.time);
      $('prayer-date').textContent = `${next.isTomorrow ? 'Tomorrow' : 'Today'} · ${helpers.formatDate(next.dateKey, { weekday: undefined, day: 'numeric', month: 'short', year: undefined })} · IST`;
      const seconds = Math.max(0, Math.ceil(next.remainingMs / 1000));
      const hours = Math.floor(seconds / 3600);
      const minutes = Math.floor(seconds % 3600 / 60);
      $('countdown').textContent = `${hours ? `${hours}h ` : ''}${String(minutes).padStart(2, '0')}m ${String(seconds % 60).padStart(2, '0')}s`;
      const key = `${next.dateKey}-${next.key}`;
      if (key !== lastPrayer) {
        lastPrayer = key;
        $('announcement').textContent = `Next prayer: ${next.label}, ${helpers.formatTime(next.time)}${next.isTomorrow ? ' tomorrow' : ''}, Indian Standard Time.`;
      }
      const missingToday = !helpers.getDay(schedule, today);
      $('message').hidden = !missingToday;
      if (missingToday) $('message').textContent = 'Today’s timetable is unavailable. The next prayer shown is from tomorrow’s published timetable.';
    }

    async function load() {
      const currentVersion = ++version;
      controller?.abort();
      controller = new AbortController();
      const requestController = controller;
      loading = true;
      $('widget').setAttribute('aria-busy', 'true');
      $('retry').disabled = true;
      $('error').hidden = true;
      $('next-prayer').hidden = true;
      $('message').hidden = false;
      $('message').textContent = 'Loading your local timetable…';
      let timedOut = false;
      const timeout = setTimeout(() => { timedOut = true; requestController.abort(); }, 15000);
      try {
        if (!locationId) throw new Error('Add a timetable identifier to this widget’s URL, for example ?q=Ernakulam_Shafi.');
        helpers ??= await import('./js/prayer-data.js');
        if (currentVersion !== version) return;
        const label = helpers.humanizeLocation(locationId);
        $('location-name').textContent = label;
        const dashboard = new URL('https://azantimes.in/');
        dashboard.searchParams.set('q', locationId);
        $('dashboard-link').href = dashboard.href;
        schedule = await helpers.loadSchedule(locationId, { signal: requestController.signal });
        if (requestController.signal.aborted || currentVersion !== version) return;
        loading = false;
        lastPrayer = null;
        tick();
      } catch (error) {
        if (currentVersion !== version) return;
        schedule = null;
        loading = false;
        $('message').hidden = true;
        $('today-date').textContent = 'Timetable unavailable';
        $('error-message').textContent = timedOut ? 'The request timed out. Check your connection and try again.' : locationId ? 'This timetable could not be loaded. Check your connection and the timetable identifier, then try again.' : error.message;
        $('error').hidden = false;
        $('retry').hidden = !locationId;
      } finally {
        clearTimeout(timeout);
        if (currentVersion === version) {
          loading = false;
          $('widget').setAttribute('aria-busy', 'false');
          $('retry').disabled = false;
        }
      }
    }

    $('retry').addEventListener('click', () => void load());
    window.addEventListener('online', () => { if (locationId && !loading) void load(); });
    document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); });
    setInterval(tick, 1000);
    void load();
  </script>
</body>
</html>
